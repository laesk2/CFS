<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>내시경 기록 관리</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <!-- 입력 탭 화면 -->
  <div id="view-input" class="view active">
    <h2>새 기록 입력</h2>
    <form id="record-form">
      <div class="form-group">
        <label>날짜</label>
        <input type="date" id="i-date" required>
      </div>
      <div class="form-group">
        <label>이름</label>
        <input type="text" id="i-name" required>
      </div>
      <div class="form-group">
        <label>등록번호 (숫자, 최대 8자리)</label>
        <!-- 아이폰 숫자 키패드 적용 부분 -->
        <input type="text" id="i-id" inputmode="numeric" pattern="[0-9]*" maxlength="8" required>
      </div>
      <div class="form-group">
        <label>나이</label>
        <input type="number" id="i-age" required>
      </div>
      <div class="form-group">
        <label>성별</label>
        <div class="radio-group">
          <input type="radio" id="i-g-m" name="i-gender" value="M">
          <label for="i-g-m">M</label>
          <input type="radio" id="i-g-f" name="i-gender" value="F">
          <label for="i-g-f">F</label>
        </div>
      </div>
      <div class="form-group">
        <label>진입 성공 여부</label>
        <div class="radio-group">
          <input type="radio" id="i-s-y" name="i-success" value="Y" checked>
          <label for="i-s-y">Y</label>
          <input type="radio" id="i-s-n" name="i-success" value="N">
          <label for="i-s-n">N</label>
        </div>
      </div>
      <div class="form-group">
        <label>진입 시간</label>
        <div class="time-input-group">
          <input type="number" id="i-time-min" min="0" placeholder="분"><span>분</span>
          <input type="number" id="i-time-sec" min="0" max="59" value="0"><span>초</span>
        </div>
      </div>
      
      <!-- 관찰 시간 추가 -->
      <div class="form-group">
        <label>관찰 시간</label>
        <div class="time-input-group">
          <input type="number" id="i-obs-min" min="0" placeholder="분"><span>분</span>
          <input type="number" id="i-obs-sec" min="0" max="59" value="0"><span>초</span>
        </div>
      </div>

      <div class="form-group">
        <label>ADR 포함 여부</label>
        <div class="radio-group">
          <input type="radio" id="i-a-y" name="i-adr" value="Y">
          <label for="i-a-y">Y</label>
          <input type="radio" id="i-a-n" name="i-adr" value="N">
          <label for="i-a-n">N</label>
        </div>
      </div>
      <div class="form-group">
        <label>조직검사 시행 여부</label>
        <div class="multi-btn-group">
          <input type="checkbox" id="i-bx-1" name="i-bx" value="Bx">
          <label for="i-bx-1">Bx</label>
          <input type="checkbox" id="i-bx-2" name="i-bx" value="CSP">
          <label for="i-bx-2">CSP</label>
          <input type="checkbox" id="i-bx-3" name="i-bx" value="EMR">
          <label for="i-bx-3">EMR</label>
        </div>
      </div>
      <div class="form-group">
        <label>조직검사 결과</label>
        <div class="multi-btn-group">
          <input type="checkbox" id="i-res-1" name="i-bx-result" value="양성">
          <label for="i-res-1">양성</label>
          <input type="checkbox" id="i-res-2" name="i-bx-result" value="선종">
          <label for="i-res-2">선종</label>
          <input type="checkbox" id="i-res-3" name="i-bx-result" value="암">
          <label for="i-res-3">암</label>
          <input type="checkbox" id="i-res-4" name="i-bx-result" value="pending">
          <label for="i-res-4">pending</label>
          <input type="checkbox" id="i-res-5" name="i-bx-result" value="기타">
          <label for="i-res-5">기타</label>
        </div>
        <input type="text" id="i-bx-result-other-txt" placeholder="기타 결과 입력" style="display:none; margin-top:10px;">
      </div>
      <div class="form-group">
        <label>검사소견</label>
        <textarea id="i-findings" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>비고</label>
        <textarea id="i-note" rows="2"></textarea>
      </div>
      <div class="button-group bottom-buttons">
        <button type="button" id="btn-reset" class="btn-secondary">초기화</button>
        <button type="button" id="btn-submit" class="btn-primary">완료</button>
      </div>
      
      <div class="button-group" style="margin-top: 15px;">
        <button type="button" id="btn-export-excel-input" class="btn-edit" style="background-color: #ff9500;">전체 데이터 엑셀 전송</button>
      </div>
    </form>
  </div>

  <!-- 목록 탭 화면 -->
  <div id="view-list" class="view">
    <div class="header-action">
      <div style="display: flex; align-items: baseline; gap: 10px;">
        <h2>목록</h2>
        <span id="adr-display" style="font-weight: 700; color: #ff3b30; font-size: 16px;">ADR --%</span>
      </div>
      <!-- ADR only 필터 버튼과 엑셀 버튼을 나란히 배치 -->
      <div style="display: flex; gap: 5px;">
        <button id="btn-filter-adr" class="btn-small filter-btn">ADR only</button>
        <button id="btn-export-excel" class="btn-small">엑셀</button>
      </div>
    </div>
    <div class="sort-bar" id="list-sort-bar">
      <span class="sort-btn" data-sort="date">날짜 ▼</span>
      <span class="sort-btn" data-sort="name">이름</span>
      <span class="sort-btn" data-sort="id">등록번호</span>
      <span class="sort-btn" data-sort="age">나이</span>
    </div>
    <div id="list-container" class="list-container"></div>
  </div>

  <!-- 휴지통 탭 화면 -->
  <div id="view-trash" class="view">
    <div class="header-action">
      <h2>휴지통</h2>
      <button id="btn-empty-trash" class="btn-small" style="background-color: #ff3b30; color: white; border: none;">비우기</button>
    </div>
    <div class="sort-bar" id="trash-sort-bar">
      <span class="sort-btn" data-sort="date">날짜 ▼</span>
      <span class="sort-btn" data-sort="name">이름</span>
      <span class="sort-btn" data-sort="id">등록번호</span>
      <span class="sort-btn" data-sort="age">나이</span>
    </div>
    <div id="trash-container" class="list-container"></div>
  </div>

  <div id="view-detail" class="view full-screen">
    <div class="detail-header">
      <button id="btn-detail-back" class="btn-text">◀ 이전</button>
      <span id="detail-title">상세 보기</span>
    </div>
    <div class="detail-content" id="detail-content-area"></div>
    <div class="detail-timestamps">
      <div id="d-created-at"></div>
      <div id="d-updated-at"></div>
    </div>
    <div class="button-group detail-buttons" id="detail-action-buttons"></div>
  </div>

  <nav class="tab-bar">
    <button class="tab-btn active" data-target="view-input">입력</button>
    <button class="tab-btn" data-target="view-list">목록</button>
    <button class="tab-btn" data-target="view-trash">휴지통</button>
  </nav>

  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-box">
      <p id="modal-msg"></p>
      <div class="modal-buttons">
        <button id="modal-btn-no" class="btn-secondary">아니요</button>
        <button id="modal-btn-yes" class="btn-primary">예</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
